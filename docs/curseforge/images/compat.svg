<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#0B0F14"/>
<g transform="translate(0, 280)">
<rect width="1200" height="640" fill="#0B0F14"/>
<text x="40" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2" text-anchor="start">Works with the other BSP mods</text>
<text x="40" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#9AA3B5" text-anchor="start">BSP-Core is required. Region Guard, RankUp and the Velocity Additions proxy plugin are optional: with them, more of the mod switches on.</text>
<rect x="40" y="110" width="270" height="500" rx="10" fill="#10151C" stroke="#FFD23A" stroke-width="1.5" opacity="1"/>
<text x="56" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFD23A" text-anchor="start">BSP-Core (required)</text>
<line x1="56" y1="152" x2="294" y2="152" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
<circle cx="62" cy="171" r="4" fill="#FFD23A"/>
<text x="74" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Your Shatter Totem travels</text>
<text x="74" y="193" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">with you on every cross-server</text>
<text x="74" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">move</text>
<circle cx="62" cy="236" r="4" fill="#FFD23A"/>
<text x="74" y="241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Recall from another server</text>
<text x="74" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">brings you back to your totem</text>
<text x="74" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">through this mod</text>
<circle cx="62" cy="301" r="4" fill="#FFD23A"/>
<text x="74" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Nothing lands within 150</text>
<text x="74" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">blocks of a totem being</text>
<text x="74" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">stolen, on any server</text>
<circle cx="62" cy="366" r="4" fill="#FFD23A"/>
<text x="74" y="371" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Extra Homes and Swift Travel</text>
<text x="74" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">give more home slots and</text>
<text x="74" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">shorter cooldowns</text>
<circle cx="62" cy="431" r="4" fill="#FFD23A"/>
<text x="74" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Team teleports: GO to a</text>
<text x="74" y="453" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">teammate from the band or</text>
<text x="74" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">BSP-Core's Team screen</text>
<circle cx="62" cy="496" r="4" fill="#FFD23A"/>
<text x="74" y="501" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">The Home Servers board on</text>
<text x="74" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">BSP-Core's Score Screens</text>
<circle cx="62" cy="544" r="4" fill="#FFD23A"/>
<text x="74" y="549" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Coins for warps and rules;</text>
<text x="74" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Access Tokens in BSP-Core's</text>
<text x="74" y="583" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">shops</text>
<rect x="325" y="110" width="270" height="500" rx="10" fill="#10151C" stroke="#19D3B0" stroke-width="1.5" opacity="1"/>
<text x="341" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#19D3B0" text-anchor="start">BSP-Region Guard (optional)</text>
<line x1="341" y1="152" x2="579" y2="152" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
<circle cx="347" cy="171" r="4" fill="#19D3B0"/>
<text x="359" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Regions forbid teleporting in,</text>
<text x="359" y="193" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">out, or setting a home</text>
<circle cx="347" cy="219" r="4" fill="#19D3B0"/>
<text x="359" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Region triggers and world-edge</text>
<text x="359" y="241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">links move players to other</text>
<text x="359" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">servers</text>
<circle cx="347" cy="284" r="4" fill="#19D3B0"/>
<text x="359" y="289" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Random teleport stays inside</text>
<text x="359" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">the world border</text>
<circle cx="347" cy="332" r="4" fill="#19D3B0"/>
<text x="359" y="337" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Buy access to an admin region</text>
<text x="359" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">with an Access Token</text>
<circle cx="347" cy="380" r="4" fill="#19D3B0"/>
<text x="359" y="385" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Shutdown triggers evacuate</text>
<text x="359" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">everyone; /back brings them</text>
<text x="359" y="419" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">home</text>
<rect x="610" y="110" width="270" height="500" rx="10" fill="#10151C" stroke="#B58CFF" stroke-width="1.5" opacity="1"/>
<text x="626" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#B58CFF" text-anchor="start">BSP-RankUp (optional)</text>
<line x1="626" y1="152" x2="864" y2="152" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
<circle cx="632" cy="171" r="4" fill="#B58CFF"/>
<text x="644" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Rank rules on portals and</text>
<text x="644" y="193" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">warps: a LuckPerms group, this</text>
<text x="644" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">or better</text>
<circle cx="632" cy="236" r="4" fill="#B58CFF"/>
<text x="644" y="241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">RankUp ranks are LuckPerms</text>
<text x="644" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">groups, so a rung name is a</text>
<text x="644" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">rule name</text>
<rect x="895" y="110" width="270" height="500" rx="10" fill="#10151C" stroke="#8FE04A" stroke-width="1.5" opacity="1"/>
<text x="911" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#8FE04A" text-anchor="start">BSP-Velocity Additions (proxy)</text>
<line x1="911" y1="152" x2="1149" y2="152" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
<circle cx="917" cy="171" r="4" fill="#8FE04A"/>
<text x="929" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">One join and leave line for</text>
<text x="929" y="193" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">the whole network: switch this</text>
<text x="929" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">backend's own lines off</text>
<circle cx="917" cy="236" r="4" fill="#8FE04A"/>
<text x="929" y="241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Players sent back to their</text>
<text x="929" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">last server on login; landings</text>
<text x="929" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">wait for them</text>
</g>
</svg>