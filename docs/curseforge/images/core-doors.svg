<text x="631.5999999999999" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#19D3B0" text-anchor="middle" letter-spacing="1">-</text>
<text x="66" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#9AA3B5" text-anchor="start">Doors: open, mode real clock 03:00-05:00, 15:00-17:00, doors rendered, close when down</text>
<line x1="56" y1="550" x2="724" y2="550" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#9AA3B5" text-anchor="start">BSP-Spawn  minecraft:overworld  120, 64, -40      frame 9x6, opening 28 cells</text>
<text x="724" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#9AA3B5" text-anchor="end">DARK</text>
<text x="780" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#E6EAF2" text-anchor="start">Four ways to open and close</text>
<text x="780" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B58CFF" text-anchor="start" letter-spacing="1.5">Manual</text>
<text x="780" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">an Open and a Close button; the panel and</text>
<text x="780" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">/bsptp portal &lt;name&gt; open|close do the same</text>
<text x="780" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">from anywhere</text>
<text x="780" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B58CFF" text-anchor="start" letter-spacing="1.5">Redstone</text>
<text x="780" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">the core reads power on any side: open while</text>
<text x="780" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">powered, or closed while powered</text>
<text x="780" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B58CFF" text-anchor="start" letter-spacing="1.5">Real clock</text>
<text x="780" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">open for up to four stretches a day on the</text>
<text x="780" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">server's clock, such as 15:00 to 17:00 and</text>
<text x="780" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">03:00 to 05:00, drawn as a day bar</text>
<text x="780" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B58CFF" text-anchor="start" letter-spacing="1.5">Game clock</text>
<text x="780" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">the same in world time, 0 to 24000</text>
<text x="780" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B58CFF" text-anchor="start" letter-spacing="1.5">Close when down</text>
<text x="780" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">the doors shut by themselves while every</text>
<text x="780" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">destination is away and reopen when one is</text>
<text x="780" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">back</text>
<text x="780" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B58CFF" text-anchor="start" letter-spacing="1.5">Warm-up</text>
<text x="780" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">up to 30 s held in the field first, with a</text>
<text x="780" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">countdown box; crouching or a hit cancels it</text>
