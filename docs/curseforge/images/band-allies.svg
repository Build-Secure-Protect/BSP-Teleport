<text x="66" y="311" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#9AA3B5" text-anchor="start">Sable</text>
<text x="119" y="311" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8B931" text-anchor="start">Gold Crows</text>
<text x="66" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#9AA3B5" text-anchor="start">offline, seen 1 d ago</text>
<line x1="56" y1="496" x2="724" y2="496" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
<text x="56" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8FE04A" text-anchor="start">Ready.      refreshes every 5 s while open</text>
<rect x="40" y="564" width="700" height="52" rx="0" fill="rgba(0,0,0,0.6)" opacity="1"/>
<text x="52" y="584" font-family="Menlo, Monaco, monospace" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="start">Ally Alex (Night Owls) wants to teleport to you.</text>
<text x="52" y="606" font-family="Menlo, Monaco, monospace" font-size="15" font-weight="normal" fill="#ffaa00" text-anchor="start">[Accept] [Deny] 30 s</text>
<text x="780" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#E6EAF2" text-anchor="start">Allies on the TEAM tab</text>
<text x="780" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">When your BSP-Core team is in an alliance,</text>
<text x="780" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">the TEAM tab gets a switch: MY TEAM is your</text>
<text x="780" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">roster as before, ALLIES lists every player</text>
<text x="780" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">of the allied teams with their team's name</text>
<text x="780" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">in its colour.</text>
<text x="780" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">Where they are: here, or on another server,</text>
<text x="780" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">with the dimension. Coordinates only when</text>
<text x="780" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">their team shares them.</text>
<text x="780" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">Allies trust each other less than teammates,</text>
<text x="780" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">so ASK asks first: the ally has 30 seconds</text>
<text x="780" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">to accept, in chat or on their band. After</text>
<text x="780" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">that it is a team teleport, with no price,</text>
<text x="780" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">and nothing lands near a running steal.</text>
<text x="780" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">Nobody who is stealing a totem can ask or be</text>
<text x="780" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">visited, and an alliance that ends cancels a</text>
<text x="780" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">waiting ask or warm-up. The same ask sits on</text>
<text x="780" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9AA3B5" text-anchor="start">the ALLIES page of BSP-Core's Team screen.</text>
</g>
