<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#0B0F14"/>
<g transform="translate(0, 280)">
<rect width="1200" height="640" fill="#0B0F14"/>
<rect x="38" y="38" width="704" height="564" rx="0" fill="#B58CFF" opacity="1"/>
<rect x="40" y="40" width="700" height="560" rx="0" fill="#10151C" opacity="1"/>
<text x="56" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#B58CFF" text-anchor="start" letter-spacing="2">PORTAL</text>
<text x="56" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9AA3B5" text-anchor="start">Hub East.  One destination per portal. Links are two-way unless Arrive only is on.</text>
